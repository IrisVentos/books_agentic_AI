[project]
name = "ai-demo"
version = "0.1.0"
description = "Web Scraping and AI Project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=0.0.14",
    "openai>=1.35.0",
    "beautifulsoup4>=4.12.3",
    "requests>=2.31.0",
    "scrapy>=2.11.0",
    "lxml>=5.1.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.3",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "python-certifi-win32==1.6.1"
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
]